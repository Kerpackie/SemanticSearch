syntax = "proto3";

option csharp_namespace = "SemanticSearch.Nexus";

package search;

// The main orchestration service for semantic search
service SearchOrchestrator {
  // Performs a complete semantic search pipeline:
  // Query -> NLP (GptApi) -> Embeddings (Glyph & Eidolon) -> Database (Mneme) -> Reranking (Arbiter)
  rpc Search (SearchRequest) returns (SearchResponse);
  
  // Performs a text-only semantic search
  rpc SearchByText (TextSearchRequest) returns (SearchResponse);
  
  // Performs an image-based semantic search
  rpc SearchByImage (ImageSearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string query = 1;
  optional bytes image = 2;  // Optional image for multimodal search
  int32 limit = 3;           // Number of results to return
  bool enable_reranking = 4; // Whether to use the reranker
  optional string customer_id = 5; // Optional customer ID for personalized reranking
}

message TextSearchRequest {
  string query = 1;
  int32 limit = 2;
  bool enable_reranking = 3;
  optional string customer_id = 4; // Optional customer ID for personalized reranking
}

message ImageSearchRequest {
  bytes image = 1;
  int32 limit = 2;
  bool enable_reranking = 3;
  optional string customer_id = 4; // Optional customer ID for personalized reranking
}

message SearchResponse {
  repeated SearchResult results = 1;
  string processed_query = 2;  // The NLP-processed query
  int32 total_results = 3;
  string outfit_name = 4;         // The GPT-suggested outfit name (e.g. "Casual Summer Look")
  string style_description = 5;   // The GPT-generated style description / rationale
}

message SearchResult {
  string id = 1;
  string name = 2;
  string description = 3;
  float score = 4;
  int32 rank = 5;
  map<string, string> metadata = 6;
}
