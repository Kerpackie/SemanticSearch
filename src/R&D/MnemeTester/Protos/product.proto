syntax = "proto3";

option csharp_namespace = "MnemeTester";

package product;

service ProductSearch {
  rpc SearchProducts (ProductSearchRequest) returns (ProductSearchResponse);
}

message ProductSearchRequest {
  repeated float textVector = 1;
  repeated float imageVector = 2;
  int32 limit = 3;
}

message ProductSearchResponse {
  repeated Product products = 1;
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  float score = 4; // Output only

  repeated float textVector = 5; // Input only
  repeated float imageVector = 6; // New: Image Embeddings

  // Flexible key-value pairs for things like "color", "category", "url"
  map<string, string> metadata = 7;
}